name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.6.2'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install depends
      run: >-
        sudo apt update &&
        sudo apt-get install -y
        '^libxcb.*-dev'
        catch
        libfmt-dev
        libgl-dev
        libgl1-mesa-dev
        libglu1-mesa-dev
        libicu-dev
        libx11-xcb-dev
        libxcb-{icccm4,image0,keysyms1,randr0,render-util0,shape0,sync1,xfixes0,xinerama0,xkb1}
        libxi-dev
        libxkbcommon-dev
        libxkbcommon-x11-0
        libxkbcommon-x11-dev
        libxrender-dev
        iverilog
        linguist-qt6
        ninja-build
        openssh-server
        p7zip-full
        python3
        python3-py7zr
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        install-deps: 'true'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.1.*'
        py7zrversion: '==0.20.*'
        extra: '--external 7z'

    - name: Configure CMake (push - no tests)
      if: github.event_name == 'push'
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_UNIT_TEST=OFF -DENABLE_CLANG_TIDY=OFF -DENABLE_DOXYGEN=OFF

    - name: Configure CMake (PR - with tests)
      if: github.event_name == 'pull_request'
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_CLANG_TIDY=OFF -DENABLE_DOXYGEN=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Smoke Test
      if: github.event_name == 'push'
      run: |
        set -e
        QSOC=./build/qsoc
        TMPD=$(mktemp -d)
        trap "rm -rf $TMPD" EXIT
        echo "--- version ---"
        $QSOC -v
        echo "--- help ---"
        $QSOC -h | head -3
        echo "--- project create ---"
        $QSOC project create -d "$TMPD" smoke_test
        echo "--- bus import ---"
        printf 'Name;Mode;Direction;Width;Qualifier\npclk;slave;in;1;\nprdata;slave;out;32;data\n' > "$TMPD/smoke.csv"
        $QSOC bus import -d "$TMPD" -l smoke_lib -b smoke_bus "$TMPD/smoke.csv"
        echo "--- module import ---"
        printf 'module smoke_mod(input clk, output [7:0] data);\nassign data = 8'\''hFF;\nendmodule\n' > "$TMPD/smoke.v"
        $QSOC module import -d "$TMPD" -l smoke_lib "$TMPD/smoke.v"
        echo "--- all smoke tests passed ---"

    - name: Full Test
      if: github.event_name == 'pull_request'
      env:
        # openssh-server and python3 are installed above, so a fixture that
        # cannot find sshd is a broken job declaration, not a developer machine.
        QSOC_TEST_DEPS_REQUIRED: '1'
      uses: coactions/setup-xvfb@v1
      with:
        working-directory: build
        run: ctest -C ${{env.BUILD_TYPE}} --rerun-failed --output-on-failure

  # The loopback sshd fixtures are the only coverage of the remote-disconnect
  # behaviour, and the job above runs no tests at all on a push. This one does,
  # on both events, with the loopback binaries only so it stays short.
  remote-loopback-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install depends
      run: >-
        sudo apt update &&
        sudo apt-get install -y
        '^libxcb.*-dev'
        catch
        libfmt-dev
        libgl-dev
        libgl1-mesa-dev
        libglu1-mesa-dev
        libicu-dev
        libx11-xcb-dev
        libxcb-{icccm4,image0,keysyms1,randr0,render-util0,shape0,sync1,xfixes0,xinerama0,xkb1}
        libxi-dev
        libxkbcommon-dev
        libxkbcommon-x11-0
        libxkbcommon-x11-dev
        libxrender-dev
        linguist-qt6
        ninja-build
        openssh-server
        p7zip-full
        python3
        python3-py7zr
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        install-deps: 'true'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.1.*'
        py7zrversion: '==0.20.*'
        extra: '--external 7z'

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_CLANG_TIDY=OFF -DENABLE_DOXYGEN=OFF

    # The recovery fixture drives the real binary, so qsoc itself is part of
    # the coverage and has to be built here.
    - name: Build loopback tests
      run: >-
        cmake --build build --config ${{env.BUILD_TYPE}} --target
        qsoc
        test_qsocagentremoterecovery
        test_qsocremoteguardafterreconnect
        test_qsocsftp_loopback
        test_qsocsftpstranded
        test_qsocsshexecstatus

    - name: Loopback Test
      env:
        # openssh-server and python3 are installed above, so a fixture that
        # cannot find sshd is a broken job declaration, not a developer machine.
        QSOC_TEST_DEPS_REQUIRED: '1'
      run: |
        set -o pipefail
        ctest --test-dir build -C ${{env.BUILD_TYPE}} --verbose \
          -R '^test_qsoc(agentremoterecovery|remoteguardafterreconnect|sftp_loopback|sftpstranded|sshexecstatus)$' \
          2>&1 | tee loopback.log
        # QtTest exits 0 on a skip, so a case that never ran would read as a
        # pass. A skip here is a missing dependency or a fixture that would not
        # come up, and either way this job has no coverage to report.
        if grep -q 'SKIP   :' loopback.log; then
          grep 'SKIP   :' loopback.log
          echo "::error::a loopback case was skipped, so the remote coverage did not run"
          exit 1
        fi

  build-windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action-windows'

    - name: Install tools
      run: choco install ninja pkgconfiglite -y

    - name: Configure CMake (push - no tests)
      if: github.event_name == 'push'
      run: >-
        cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DSLANG_USE_MIMALLOC=OFF
        -DENABLE_UNIT_TEST=OFF
        -DENABLE_CLANG_TIDY=OFF
        -DENABLE_DOXYGEN=OFF

    - name: Configure CMake (PR - with tests)
      if: github.event_name == 'pull_request'
      run: >-
        cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DSLANG_USE_MIMALLOC=OFF
        -DENABLE_CLANG_TIDY=OFF
        -DENABLE_DOXYGEN=OFF

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Smoke Test
      if: github.event_name == 'push'
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        $QSOC = ".\build\qsoc.exe"
        $TMPD = Join-Path $env:TEMP "qsoc_smoke"
        New-Item -ItemType Directory -Force -Path $TMPD | Out-Null
        try {
          Write-Host "--- version ---"
          & $QSOC -v
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          Write-Host "--- help ---"
          & $QSOC -h
          Write-Host "--- project create ---"
          & $QSOC project create -d $TMPD smoke_test
          if ($LASTEXITCODE -ne 0) { throw "project create failed" }
          Write-Host "--- bus import ---"
          $csvFile = Join-Path $TMPD "smoke.csv"
          [IO.File]::WriteAllText($csvFile, "Name;Mode;Direction;Width;Qualifier`npclk;slave;in;1;`nprdata;slave;out;32;data`n")
          & $QSOC bus import -d $TMPD -l smoke_lib -b smoke_bus $csvFile
          if ($LASTEXITCODE -ne 0) { throw "bus import failed" }
          Write-Host "--- module import (skip: slang path backslash issue) ---"
          Write-Host "--- all smoke tests passed ---"
        } finally {
          Remove-Item -Recurse -Force $TMPD -ErrorAction SilentlyContinue
        }

    - name: Full Test
      if: github.event_name == 'pull_request'
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        cd build
        # The loopback sshd fixture and the remote job-control scripts are
        # POSIX-only (sshd path lookup, the password database, /bin/sh on the
        # target, POSIX signals), so Windows has no remote coverage. Excluded
        # by name: letting them skip would look green.
        ctest -C ${{ env.BUILD_TYPE }} --rerun-failed --output-on-failure -E "test_qsocgui|test_qsocagenttool$|test_qsoccliparsegeneratereportunconnected|test_qsocagentremoterecovery|test_qsocremoteguardafterreconnect|test_qsocsftp_loopback|test_qsocsftpstranded|test_qsocsshexecstatus|test_qsoctoolagentbindinglifetime|test_qsoctoolagenthostbindingrecovery|test_qsocremotejobscript"

    # ctest records no test output on Windows, so a failure arrives as a bare
    # exit code. Re-run each failed binary with its own log file and print it.
    - name: Failed test diagnostics
      if: failure()
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        cd build
        $listing = "Testing/Temporary/LastTestsFailed.log"
        if (-Not (Test-Path $listing)) { Write-Host "no failure listing"; exit 0 }
        foreach ($line in Get-Content $listing) {
          $name = ($line -split ':', 2)[1]
          $exe = Get-ChildItem -Recurse -Filter "$name.exe" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($null -eq $exe) { Write-Host "===== $name (binary not found) ====="; continue }
          $log = Join-Path $env:RUNNER_TEMP "$name.qtestlog"
          Write-Host "===== $name ====="
          & $exe.FullName -o "$log,txt" 2>&1 | ForEach-Object { Write-Host "  | $_" }
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log produced)" }
        }

  build-macos:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action-macos'

    - name: Install tools
      run: brew install ninja pkg-config

    - name: Configure CMake (push - no tests)
      if: github.event_name == 'push'
      run: >-
        cmake -B build -G Ninja
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DSLANG_USE_MIMALLOC=OFF
        -DENABLE_UNIT_TEST=OFF
        -DENABLE_CLANG_TIDY=OFF
        -DENABLE_DOXYGEN=OFF

    - name: Configure CMake (PR - with tests)
      if: github.event_name == 'pull_request'
      run: >-
        cmake -B build -G Ninja
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DSLANG_USE_MIMALLOC=OFF
        -DENABLE_CLANG_TIDY=OFF
        -DENABLE_DOXYGEN=OFF

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Smoke Test
      if: github.event_name == 'push'
      run: |
        set -e
        QSOC=./build/qsoc.app/Contents/MacOS/qsoc
        TMPD=$(mktemp -d)
        trap "rm -rf $TMPD" EXIT
        echo "--- version ---"
        $QSOC -v
        echo "--- help ---"
        $QSOC -h | head -3
        echo "--- project create ---"
        $QSOC project create -d "$TMPD" smoke_test
        echo "--- bus import ---"
        printf 'Name;Mode;Direction;Width;Qualifier\npclk;slave;in;1;\nprdata;slave;out;32;data\n' > "$TMPD/smoke.csv"
        $QSOC bus import -d "$TMPD" -l smoke_lib -b smoke_bus "$TMPD/smoke.csv"
        echo "--- module import ---"
        printf 'module smoke_mod(input clk, output [7:0] data);\nassign data = 8'\''hFF;\nendmodule\n' > "$TMPD/smoke.v"
        $QSOC module import -d "$TMPD" -l smoke_lib "$TMPD/smoke.v"
        echo "--- all smoke tests passed ---"

    - name: Full Test
      if: github.event_name == 'pull_request'
      # QSOC_TEST_DEPS_REQUIRED stays unset here until one run proves an
      # unprivileged sshd comes up on this image; a fixture that starts and
      # then fails already fails on macOS today.
      # The remote job-control and recovery suite needs that sshd or a Linux
      # /proc, neither of which this image gives, so exclude it by name and
      # let remote-loopback-linux stay its gate.
      run: |
        cd build
        QT_QPA_PLATFORM=offscreen ctest -C ${{ env.BUILD_TYPE }} --rerun-failed --output-on-failure -E "test_qsocagentremoterecovery|test_qsocremotecwdowner|test_qsocremotedeadlinkcost|test_qsocsshabortlatency|test_qsocremotejobscript"

  build-nix:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Refresh submodules
      # Belt and braces: `submodules: recursive` above already clones
      # external/*, but some recently-added entries (libssh2, cmark-gfm,
      # lexbor) were observed missing in the nix sandbox on older Nix
      # versions. Re-running update ensures the working tree mirrors
      # `.gitmodules` exactly before nix snapshots it.
      run: git submodule update --init --recursive --force

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Diagnose source tree
      run: |
        echo "external/ entries:"
        ls -1 external/ | head -25
        echo
        echo "missing submodule check:"
        for d in libssh2 cmark-gfm lexbor mbedtls slang; do
          if [ ! -d "external/$d" ]; then
            echo "MISSING: external/$d"
            exit 1
          fi
          if [ -z "$(ls -A external/$d 2>/dev/null)" ]; then
            echo "EMPTY: external/$d"
            exit 1
          fi
        done
        echo "ok"

    - name: Nix build (with submodules)
      run: nix build ".?submodules=1" --print-build-logs

    - name: Smoke Test
      run: |
        set -e
        QSOC=./result/bin/qsoc
        echo "--- version ---"
        $QSOC -v
        echo "--- no missing libs ---"
        if ldd $QSOC | grep -q "not found"; then
          ldd $QSOC | grep "not found"
          exit 1
        fi
        echo "--- ok ---"

  cppcheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install depends
      run: >-
        sudo apt update &&
        sudo apt-get install -y
        '^libxcb.*-dev'
        cppcheck
        libfmt-dev
        libgl-dev
        libglu1-mesa-dev
        libicu-dev
        libx11-xcb-dev
        libxi-dev
        libxkbcommon-dev
        libxkbcommon-x11-dev
        libxrender-dev
        ninja-build
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'
    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_CLANG_TIDY=OFF -DENABLE_DOXYGEN=OFF -DENABLE_UNIT_TEST=OFF

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Static Analysis (cppcheck)
      run: cmake --build build --target cppcheck
