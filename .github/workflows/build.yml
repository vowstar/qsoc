name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]

# A newer push to a pull request cancels its running checks. A push to main
# gets a group of its own, so it is never cancelled or held as pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.6.2'
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content

jobs:
  # What a pull request touches decides which jobs it needs. A job skipped by
  # its `if` reports success to branch protection, and linux-tests fails when
  # this job does, so a broken classification cannot pass as green.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      nix: ${{ steps.classify.outputs.nix }}
    steps:
    - name: Classify changed files
      id: classify
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        CHANGED: ${{ github.event.pull_request.changed_files }}
      run: |
        if [ "$EVENT" != pull_request ]; then
          echo "docs-only=false" >> "$GITHUB_OUTPUT"
          echo "nix=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
          --jq '.[] | [.filename, .previous_filename // ""] | @tsv' > files.tsv
        cut -f1 files.tsv > files.txt
        cut -f2 files.tsv | sed '/^$/d' >> files.txt
        cat files.txt
        # The listing stops at 3000 files, and a short one proves nothing.
        listed=$(wc -l < files.tsv)
        docs=false
        # Typst sources and Markdown only. Images and the resource list are
        # compiled into the binary, so they take the full run.
        if [ "$listed" -eq "$CHANGED" ] && [ "$listed" -gt 0 ] &&
          ! grep -qvE '^doc/.*\.typ$|\.md$' files.txt &&
          ! grep -qE '^doc/en/image/|^doc/qsoc_docs\.qrc$' files.txt; then
          docs=true
        fi
        nix=false
        if [ "$listed" -ne "$CHANGED" ] ||
          grep -qE '^flake\.|(^|/)CMakeLists\.txt$|^cmake/|^external/|^\.gitmodules$|^\.github/workflows/' files.txt; then
          nix=true
        fi
        echo "docs-only=$docs nix=$nix"
        echo "docs-only=$docs" >> "$GITHUB_OUTPUT"
        echo "nix=$nix" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install depends
      run: >-
        bash .github/scripts/install-linux-deps.sh
        '^libxcb.*-dev'
        catch
        ccache
        libfmt-dev
        libgl-dev
        libgl1-mesa-dev
        libglu1-mesa-dev
        libicu-dev
        librsvg2-bin
        libx11-xcb-dev
        libxcb-{icccm4,image0,keysyms1,randr0,render-util0,shape0,sync1,xfixes0,xinerama0,xkb1}
        libxi-dev
        libxkbcommon-dev
        libxkbcommon-x11-0
        libxkbcommon-x11-dev
        libxrender-dev
        iverilog
        lld
        linguist-qt6
        make
        ninja-build
        openssh-server
        p7zip-full
        poppler-utils
        python3
        python3-py7zr
        unzip
        xvfb
    - name: Install document renderer
      if: github.event_name == 'pull_request'
      timeout-minutes: 45
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/LibreOffice_26.8.3_Linux_x86-64_deb.tar.gz"
        curl --version
        curl --fail --location --retry 3 --retry-all-errors \
          --connect-timeout 30 --max-time 1800 --retry-max-time 120 --speed-limit 1024 --speed-time 60 \
          https://ftp.osuosl.org/pub/tdf/libreoffice/stable/26.8.3/deb/x86_64/LibreOffice_26.8.3_Linux_x86-64_deb.tar.gz \
          --output "$archive"
        printf '%s  %s\n' e7cd3538e85818ff9dd9bb65386769fde927011242aace5a144989f4000dcabf "$archive" | sha256sum --check -
        extracted="$RUNNER_TEMP/document-renderer"
        mkdir -p "$extracted" "$RUNNER_TEMP/document-bin"
        tar -xzf "$archive" -C "$extracted"
        sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends "$extracted"/*/DEBS/*.deb
        for program in /opt/libreoffice*/program/soffice; do
          if [[ -x "$program" ]] && "$program" --version | grep -q '^LibreOffice 26\.8\.3'; then
            ln -s "$program" "$RUNNER_TEMP/document-bin/libreoffice"
            break
          fi
        done
        "$RUNNER_TEMP/document-bin/libreoffice" --version
        echo "$RUNNER_TEMP/document-bin" >> "$GITHUB_PATH"
        pdfinfo -v
        pdftotext -v
        pdftoppm -v

    # Only pushes to main save the cache, so a pull request reads main's.
    - name: Compiler cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: build-linux
        max-size: 2G
        evict-old-files: job
        save: ${{ github.event_name == 'push' }}
    - name: Install formal tools
      if: github.event_name == 'pull_request'
      run: |
        archive="$RUNNER_TEMP/oss-cad-suite.tgz"
        curl --fail --location --retry 3 \
          https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-08-25/oss-cad-suite-linux-x64-20260825.tgz \
          --output "$archive"
        echo "9a971a52f71e32c69128ed32b63719ced482c6ed3b8728d4e109472b9a4cee21  $archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/oss-cad-suite"
        tar -xzf "$archive" -C "$RUNNER_TEMP/oss-cad-suite" --strip-components=1
        echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        install-deps: 'true'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.1.*'
        py7zrversion: '==0.20.*'

    - name: Verify source archive
      run: |
        python3 .github/scripts/test-source-archive.py
        python3 .github/scripts/source-archive.py \
          --repository . --ref "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/source-archive"
        cd "$RUNNER_TEMP/source-archive"
        sha256sum --check qsoc-*.tar.xz.sha256
        mkdir "$RUNNER_TEMP/qsoc-source"
        tar -xJf qsoc-*.tar.xz -C "$RUNNER_TEMP/qsoc-source" --strip-components=1
        test ! -e "$RUNNER_TEMP/qsoc-source/.git"

    # Tests are built on a push too, so the saved cache holds their objects.
    # Pushes also run the local-process and deployment checks.
    - name: Configure CMake
      run: |
        cd "$RUNNER_TEMP/qsoc-source"
        sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" \
          env "PATH=$PATH" "HOME=$HOME" "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" \
          "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" \
          "CCACHE_DIR=${CCACHE_DIR:-$GITHUB_WORKSPACE/.ccache}" \
          "CCACHE_BASEDIR=$RUNNER_TEMP/qsoc-source" \
          "CCACHE_COMPILERCHECK=$CCACHE_COMPILERCHECK" \
          cmake -B "$GITHUB_WORKSPACE/build" -G Ninja \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_LINKER_TYPE=LLD \
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
          -DFETCHCONTENT_SOURCE_DIR_FMT="$PWD/external/fmt" \
          -DQSOC_USE_BUNDLED_ZLIB=ON \
          -DSLANG_USE_MIMALLOC=OFF \
          -DSLANG_INCLUDE_TESTS=OFF \
          -DENABLE_CLANG_TIDY=OFF \
          -DENABLE_DOXYGEN=OFF \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      run: |
        cd "$RUNNER_TEMP/qsoc-source"
        sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" \
          env "PATH=$PATH" "HOME=$HOME" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
          "CCACHE_DIR=${CCACHE_DIR:-$GITHUB_WORKSPACE/.ccache}" \
          "CCACHE_BASEDIR=$RUNNER_TEMP/qsoc-source" \
          "CCACHE_COMPILERCHECK=$CCACHE_COMPILERCHECK" \
          cmake --build "$GITHUB_WORKSPACE/build" --config ${{env.BUILD_TYPE}}

    - name: Local process contracts
      run: python3 .github/scripts/run-core-tests.py build

    - name: Stage deployment
      run: |
        python3 .github/scripts/test-stage-deployment.py
        DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
        mkdir -p "$RUNNER_TEMP/deployment-tools"
        curl --fail --location --retry 3 \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
          --output "$RUNNER_TEMP/deployment-tools/linuxdeploy-x86_64.AppImage"
        curl --fail --location --retry 3 \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
          --output "$RUNNER_TEMP/deployment-tools/linuxdeploy-plugin-qt-x86_64.AppImage"
        chmod +x "$RUNNER_TEMP/deployment-tools/"*.AppImage
        export QMAKE="$QT_ROOT_DIR/bin/qmake"
        python3 .github/scripts/stage-deployment.py build AppDir \
          --linuxdeploy "$RUNNER_TEMP/deployment-tools/linuxdeploy-x86_64.AppImage"

    - name: Verify deployment
      run: >-
        python3 .github/scripts/verify-deployment.py AppDir/usr/bin
        --desktop AppDir/usr/share/applications/qsoc.desktop

    - name: Smoke Test
      if: github.event_name == 'push'
      run: |
        set -e
        QSOC=./build/qsoc
        TMPD=$(mktemp -d)
        trap 'rm -rf "$TMPD"' EXIT
        echo "--- version ---"
        $QSOC -v
        echo "--- help ---"
        $QSOC -h | head -3
        echo "--- project create ---"
        $QSOC project create -d "$TMPD" smoke_test
        echo "--- bus import ---"
        printf 'Name;Mode;Direction;Width;Qualifier\npclk;slave;in;1;\nprdata;slave;out;32;data\n' > "$TMPD/smoke.csv"
        $QSOC bus import -d "$TMPD" -l smoke_lib -b smoke_bus "$TMPD/smoke.csv"
        echo "--- module import ---"
        printf 'module smoke_mod(input clk, output [7:0] data);\nassign data = 8'\''hFF;\nendmodule\n' > "$TMPD/smoke.v"
        $QSOC module import -d "$TMPD" -l smoke_lib "$TMPD/smoke.v"
        echo "--- all smoke tests passed ---"

    # This target includes the local and forced-SFTP document contracts.
    - name: Build test SFTP peer
      if: github.event_name == 'pull_request'
      run: >-
        python3 .github/scripts/build-test-sftp-peer.py
        --cache "${{ runner.temp }}/qsoc-test-go"
        --output "build/test/qsoc_test_sftp_peer"

    - name: Portable SFTP peer contracts
      if: github.event_name == 'pull_request'
      working-directory: build
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
      run: |
        set -euo pipefail
        for target in test_qsocsftppeer test_qsocsftpreadfile; do
          log="$RUNNER_TEMP/$target.qtestlog"
          ./test/"$target" -o "$log,txt" || { cat "$log"; exit 1; }
          cat "$log"
          if grep -Eq '(^|[[:space:]])SKIP[[:space:]]*:' "$log"; then
            echo "::error::$target had a skipped contract"
            exit 1
          fi
        done

    - name: Waveform SFTP contracts
      if: github.event_name == 'pull_request'
      working-directory: build
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
        QSOC_BIN_DIR: ${{ github.workspace }}/build
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/waveform-sftp.qtestlog"
        ./test/test_qsoctoolwaveform sharedFstTickAcrossSections remoteWaveforms completedRemoteCachesReleaseHandles remoteSourceLifecycle -o "$log,txt" || { cat "$log"; exit 1; }
        cat "$log"
        if grep -Eq '(^|[[:space:]])SKIP[[:space:]]*:' "$log"; then
          echo '::error::a waveform SFTP contract was skipped'
          exit 1
        fi

    - name: Document reading contracts
      if: github.event_name == 'pull_request'
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
      run: |
        set -o pipefail
        xvfb-run -a ctest --test-dir build -C ${{env.BUILD_TYPE}} \
          --verbose --no-tests=error -R '^(test_qsoctooldocument|test_qsocagentimagebudget)$' \
          2>&1 | tee document-tests.log
        if grep -Eq '(^|[[:space:]])SKIP[[:space:]]*:' document-tests.log; then
          echo '::error::Document contracts must run without skips'
          exit 1
        fi

    # Every remaining test without a ci-* shard label. The shards run in test-linux.
    - name: Unit Test
      if: github.event_name == 'pull_request'
      env:
        # openssh-server and python3 are installed above, so a fixture that
        # cannot find sshd is a broken job declaration, not a developer machine.
        QSOC_TEST_DEPS_REQUIRED: '1'
      run: |
        set -o pipefail
        xvfb-run -a ctest --test-dir build -C ${{env.BUILD_TYPE}} \
          --output-on-failure --no-tests=error \
          -LE '^ci-(sim-1|sim-2|formal)$' -E '^test_qsoctooldocument$' --repeat until-pass:2 \
          2>&1 | tee ctest.log

    - name: Unit Test report
      if: always() && github.event_name == 'pull_request'
      run: .github/scripts/ctest-report.sh ctest.log 300

  # The long simulation and formal tests, by ctest label. Each shard builds
  # only its own test binaries from build-linux's compiler cache. Shards never
  # retry: a failure there is a design or tool problem, not a flaky fixture.
  test-linux:
    name: test-linux (${{ matrix.shard }})
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.docs-only != 'true' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: sim-1
          jobs: 1
        - shard: sim-2
          jobs: 1
        - shard: formal
          jobs: 4

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install depends
      run: >-
        bash .github/scripts/install-linux-deps.sh
        '^libxcb.*-dev'
        catch
        ccache
        libfmt-dev
        libgl-dev
        libgl1-mesa-dev
        libglu1-mesa-dev
        libicu-dev
        libx11-xcb-dev
        libxcb-{icccm4,image0,keysyms1,randr0,render-util0,shape0,sync1,xfixes0,xinerama0,xkb1}
        libxi-dev
        libxkbcommon-dev
        libxkbcommon-x11-0
        libxkbcommon-x11-dev
        libxrender-dev
        iverilog
        lld
        linguist-qt6
        make
        ninja-build
        openssh-server
        p7zip-full
        python3
        python3-py7zr
        xvfb
    - name: Compiler cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: build-linux
        max-size: 2G
        save: false
    - name: Install formal tools
      run: |
        archive="$RUNNER_TEMP/oss-cad-suite.tgz"
        curl --fail --location --retry 3 \
          https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-08-25/oss-cad-suite-linux-x64-20260825.tgz \
          --output "$archive"
        echo "9a971a52f71e32c69128ed32b63719ced482c6ed3b8728d4e109472b9a4cee21  $archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/oss-cad-suite"
        tar -xzf "$archive" -C "$RUNNER_TEMP/oss-cad-suite" --strip-components=1
        echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        install-deps: 'true'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.1.*'
        py7zrversion: '==0.20.*'

    - name: Configure CMake
      run: >-
        cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_LINKER_TYPE=LLD
        -DENABLE_CLANG_TIDY=OFF
        -DENABLE_DOXYGEN=OFF
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        ${{ matrix.shard == 'sim-1' && '-DSLANG_USE_MIMALLOC=ON' || '' }}

    - name: Check allocator object copy
      if: matrix.shard == 'sim-1'
      run: cmake --build build --config ${{env.BUILD_TYPE}} --target mimalloc-obj-target

    - name: Build shard tests
      run: |
        mapfile -t tests < <(ctest --test-dir build -N -L '^ci-${{ matrix.shard }}$' |
          sed -n 's/^ *Test *#[0-9]*: //p')
        echo "${tests[@]}"
        cmake --build build --config ${{env.BUILD_TYPE}} --target "${tests[@]}"

    - name: Shard Test
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
      run: |
        set -o pipefail
        xvfb-run -a ctest --test-dir build -C ${{env.BUILD_TYPE}} \
          --output-on-failure --no-tests=error \
          -L '^ci-${{ matrix.shard }}$' -j ${{ matrix.jobs }} \
          2>&1 | tee ctest.log

    - name: Shard Test report
      if: always()
      run: .github/scripts/ctest-report.sh ctest.log

  # The one Linux test check to require: every shard passed, or a docs-only
  # change skipped them. A draft never passes, so it never looks landable.
  linux-tests:
    needs: [changes, build-linux, test-linux]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      env:
        CHANGES: ${{ needs.changes.result }}
        BUILD: ${{ needs.build-linux.result }}
        SHARDS: ${{ needs.test-linux.result }}
        DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
        DRAFT: ${{ github.event.pull_request.draft }}
      run: |
        echo "changes=$CHANGES build-linux=$BUILD test-linux=$SHARDS docs-only=$DOCS_ONLY draft=$DRAFT"
        if [ "$DRAFT" = true ]; then
          echo "::error::draft: heavy shards skipped"
          exit 1
        fi
        if [ "$CHANGES" != success ] || [ "$BUILD" != success ]; then
          echo "::error::changes or build-linux did not succeed"
          exit 1
        fi
        if [ "$SHARDS" = success ]; then
          exit 0
        fi
        if [ "$SHARDS" = skipped ] && [ "$DOCS_ONLY" = true ]; then
          echo "docs-only change: shards skipped"
          exit 0
        fi
        echo "::error::test-linux result is $SHARDS"
        exit 1

  # The loopback sshd fixtures are the only coverage of the remote-disconnect
  # behaviour, and build-linux runs no tests at all on a push. This one does,
  # on both events, with the loopback binaries only so it stays short.
  remote-loopback-linux:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install depends
      run: >-
        bash .github/scripts/install-linux-deps.sh
        '^libxcb.*-dev'
        catch
        ccache
        libfmt-dev
        libgl-dev
        libgl1-mesa-dev
        libglu1-mesa-dev
        libicu-dev
        libx11-xcb-dev
        libxcb-{icccm4,image0,keysyms1,randr0,render-util0,shape0,sync1,xfixes0,xinerama0,xkb1}
        libxi-dev
        libxkbcommon-dev
        libxkbcommon-x11-0
        libxkbcommon-x11-dev
        libxrender-dev
        lld
        linguist-qt6
        ninja-build
        openssh-server
        p7zip-full
        python3
        python3-py7zr
    # Same compile flags as build-linux, so read its cache and never save one.
    - name: Compiler cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: build-linux
        max-size: 2G
        save: false
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        install-deps: 'true'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.1.*'
        py7zrversion: '==0.20.*'

    - name: Configure CMake
      run: >-
        cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_LINKER_TYPE=LLD
        -DENABLE_CLANG_TIDY=OFF
        -DENABLE_DOXYGEN=OFF

    # The recovery fixture drives the real binary, so qsoc itself is part of
    # the coverage and has to be built here.
    - name: Build loopback tests
      run: >-
        cmake --build build --config ${{env.BUILD_TYPE}} --target
        qsoc
        test_qsocagentremoterecovery
        test_qsocagentruntimeremote
        test_qsocremoteguardafterreconnect
        test_qsocremoteexecabort
        test_qsocremotehostprobe
        test_qsocremotejobwatcher
        test_qsocremotetrust
        test_qsocremoteworkspacetools
        test_qsocremotewritabledirs
        test_qsocsftp_loopback
        test_qsocsftpstranded
        test_qsocsshcrypto
        test_qsocsshexecstatus
        test_qsocworkspacebinding

    - name: Loopback Test
      env:
        # openssh-server and python3 are installed above, so a fixture that
        # cannot find sshd is a broken job declaration, not a developer machine.
        QSOC_TEST_DEPS_REQUIRED: '1'
      run: |
        set -o pipefail
        ctest --test-dir build -C ${{env.BUILD_TYPE}} --verbose \
          -R '^test_qsoc(agentremoterecovery|agentruntimeremote|remoteexecabort|remoteguardafterreconnect|remotehostprobe|remotejobwatcher|remotetrust|remoteworkspacetools|remotewritabledirs|sftp_loopback|sftpstranded|sshcrypto|sshexecstatus|workspacebinding)$' \
          2>&1 | tee loopback.log
        # QtTest exits 0 on a skip, so a case that never ran would read as a
        # pass. A skip here is a missing dependency or a fixture that would not
        # come up, and either way this job has no coverage to report.
        if grep -q 'SKIP   :' loopback.log; then
          grep 'SKIP   :' loopback.log
          echo "::error::a loopback case was skipped, so the remote coverage did not run"
          exit 1
        fi

  build-windows:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action-windows'

    - name: Install tools
      run: choco install ninja pkgconfiglite -y

    - name: Install PDF test tools
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "poppler.zip"
        Invoke-WebRequest "https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip" -OutFile $archive
        if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0") {
          throw "PDF test tool checksum mismatch"
        }
        $destination = Join-Path $env:RUNNER_TEMP "poppler"
        Expand-Archive $archive -DestinationPath $destination
        $bin = Join-Path $destination "poppler-26.09.0/Library/bin"
        $null = Get-Item "$bin/pdftotext.exe", "$bin/pdfdetach.exe"
        $bin >> $env:GITHUB_PATH

    - name: Install document renderer
      if: github.event_name == 'pull_request'
      timeout-minutes: 45
      run: |
        $package = Join-Path $env:RUNNER_TEMP "LibreOffice_26.8.3_Win_x86-64.msi"
        curl.exe --version
        curl.exe --fail --location --retry 3 --retry-all-errors `
          --connect-timeout 30 --max-time 1800 --retry-max-time 120 --speed-limit 1024 --speed-time 60 `
          "https://ftp.osuosl.org/pub/tdf/libreoffice/stable/26.8.3/win/x86_64/LibreOffice_26.8.3_Win_x86-64.msi" --output $package
        if ($LASTEXITCODE -ne 0) { throw "Office renderer download failed: $LASTEXITCODE" }
        if ((Get-FileHash $package -Algorithm SHA256).Hash -ne "0e6918c273eabbdbbd800ee0dacbbf130a14c13c2e4cec861b06dd59e015bf94") {
          throw "Office renderer checksum mismatch"
        }
        $installer = Start-Process msiexec.exe -ArgumentList "/i `"$package`" /qn /norestart" -Wait -PassThru
        if ($installer.ExitCode -notin 0, 3010) { throw "Office renderer installation failed: $($installer.ExitCode)" }
        $program = Join-Path $env:ProgramFiles "LibreOffice/program/soffice.com"
        & $program --version
        if ($LASTEXITCODE -ne 0) { throw "Office renderer version probe failed" }
        "QSOC_TEST_OFFICE_DIR=$(Split-Path $program)" >> $env:GITHUB_ENV
        Get-Command unzip | Select-Object Source
        & unzip -v | Select-Object -First 2

    # The action recommends sccache over ccache for MSVC.
    - name: Compiler cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        variant: sccache
        key: build-windows
        max-size: 2G
        save: ${{ github.event_name == 'push' }}

    - name: Configure CMake
      run: >-
        cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        -DQSOC_USE_BUNDLED_ZLIB=ON
        -DSLANG_USE_MIMALLOC=OFF
        -DENABLE_CLANG_TIDY=OFF
        -DENABLE_DOXYGEN=OFF

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Local process contracts
      run: python .github/scripts/run-core-tests.py build

    - name: Stage deployment
      run: python .github/scripts/stage-deployment.py build deploy

    - name: Verify deployment
      run: python .github/scripts/verify-deployment.py deploy

    - name: Smoke Test
      if: github.event_name == 'push'
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        $QSOC = ".\build\qsoc.exe"
        $TMPD = Join-Path $env:TEMP "qsoc_smoke"
        New-Item -ItemType Directory -Force -Path $TMPD | Out-Null
        try {
          Write-Host "--- version ---"
          & $QSOC -v
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          Write-Host "--- help ---"
          & $QSOC -h
          Write-Host "--- project create ---"
          & $QSOC project create -d $TMPD smoke_test
          if ($LASTEXITCODE -ne 0) { throw "project create failed" }
          Write-Host "--- bus import ---"
          $csvFile = Join-Path $TMPD "smoke.csv"
          [IO.File]::WriteAllText($csvFile, "Name;Mode;Direction;Width;Qualifier`npclk;slave;in;1;`nprdata;slave;out;32;data`n")
          & $QSOC bus import -d $TMPD -l smoke_lib -b smoke_bus $csvFile
          if ($LASTEXITCODE -ne 0) { throw "bus import failed" }
          Write-Host "--- module import (skip: slang path backslash issue) ---"
          Write-Host "--- all smoke tests passed ---"
        } finally {
          Remove-Item -Recurse -Force $TMPD -ErrorAction SilentlyContinue
        }

    - name: SSH connection preflight
      if: github.event_name == 'pull_request'
      working-directory: build
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        & ./test/test_qsocremoteconnection.exe proxyJumpCyclesFailBeforeOpeningANetworkConnection -o ssh-cycle-preflight.txt,txt
        $cycleExit = $LASTEXITCODE
        Get-Content ssh-cycle-preflight.txt
        if ($cycleExit -ne 0) { throw 'SSH cycle preflight failed' }
        & ./test/test_qsocsshsession.exe testConnectToClosedPort -o ssh-closed-port-preflight.txt,txt
        $closedPortExit = $LASTEXITCODE
        Get-Content ssh-closed-port-preflight.txt
        if ($closedPortExit -ne 0) { throw 'SSH closed-port preflight failed' }

    - name: Build test SFTP peer
      if: github.event_name == 'pull_request'
      run: >-
        python .github/scripts/build-test-sftp-peer.py
        --cache "${{ runner.temp }}/qsoc-test-go"
        --output "build/test/qsoc_test_sftp_peer.exe"

    - name: Portable SFTP peer contracts
      if: github.event_name == 'pull_request'
      working-directory: build
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        foreach ($target in 'test_qsocsftppeer', 'test_qsocsftpreadfile') {
          $log = Join-Path $env:RUNNER_TEMP "${target}.qtestlog"
          & "./test/${target}.exe" -o "$log,txt"
          $testExit = $LASTEXITCODE
          Get-Content $log
          if ($testExit -ne 0 -or (Select-String -Path $log -Pattern '(^|\s)SKIP\s*:' -Quiet)) { throw "$target did not run all contracts" }
        }

    - name: Waveform SFTP contracts
      if: github.event_name == 'pull_request'
      working-directory: build
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
        QSOC_BIN_DIR: ${{ github.workspace }}/build
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        $log = Join-Path $env:RUNNER_TEMP 'waveform-sftp.qtestlog'
        & ./test/test_qsoctoolwaveform.exe sharedFstTickAcrossSections remoteWaveforms completedRemoteCachesReleaseHandles remoteSourceLifecycle -o "$log,txt"
        $testExit = $LASTEXITCODE
        Get-Content $log
        if ($testExit -ne 0 -or (Select-String -Path $log -Pattern '(^|\s)SKIP\s*:' -Quiet)) { throw 'Waveform SFTP contracts did not all run' }

    - name: Document reading contracts
      if: github.event_name == 'pull_request'
      working-directory: build
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
        QT_QPA_PLATFORM: offscreen
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH;$env:QSOC_TEST_OFFICE_DIR"
        $log = Join-Path $env:RUNNER_TEMP "document-contracts.qtestlog"
        & ./test/test_qsoctooldocument.exe remoteDocumentUsesSftpAndPreservesItsSource pdfPageTextAndEmptyTextLayer pdfPageImageUsesAttachmentPipeline pdfRegionsMatchSourceRender documentCursorSurvivesOuterArtifactTruncation pdfRegionRejectsInvalidOrExcessiveRequests nativeBoxesAlignWithRotatedSourceGlyphs nativeBoxesKeepChineseSymbolsAndIndependentContinuation pdfFineTextRegionPreservesGeneratedPixels officeRendererRequiresExplicitChoiceAndScreensActiveContent officeRendererProducesBoundedDerivedPages officeMediaRetainsOccurrenceLocationsAndOriginalBytes officeMediaMemberPatternsAreLiteral officeMediaRejectsMalformedRelationshipsAndLimits -o "$log,txt"
        $testExit = $LASTEXITCODE
        Get-Content $log
        if ($testExit -ne 0 -or (Select-String -Path $log -Pattern '^SKIP' -Quiet)) { throw "Document reading contracts did not all run" }

        $log = Join-Path $env:RUNNER_TEMP "document-image-delivery.qtestlog"
        & ./test/test_qsocagentimagebudget.exe preservedImagesReachProvider -o "$log,txt"
        $testExit = $LASTEXITCODE
        Get-Content $log
        if ($testExit -ne 0 -or (Select-String -Path $log -Pattern '(^|\s)SKIP\s*:' -Quiet)) { throw "Document image delivery contracts did not all run" }

    - name: Full Test
      if: github.event_name == 'pull_request'
      env:
        QT_FORCE_STDERR_LOGGING: '1'
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        cd build
        $probeLog = & ./test/test_qsocsmtservice.exe lexicalRejections 2>&1
        $probeExit = $LASTEXITCODE
        $probeLog | Write-Output
        if ($probeExit -ne 0 -or ($probeLog -join "`n") -notmatch 'PASS') {
          throw "QtTest output did not reach the captured log"
        }
        # POSIX-only loopback and job-control suites remain excluded by name.
        # Portable SFTP and remote document contracts run above on Windows.
        ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --repeat until-pass:2 -E "test_qsocgui(licensedialog|buseditorwindow|schematicsnapshot|prccontrollergrouping|prcnetlist|moduleeditorwindow|moduleeditormodels|schematicwindow)$|test_qsocagenttool$|test_qsoccliparsegeneratereportunconnected|test_qsocagentremoterecovery|test_qsocagentruntimeremote|test_qsocremoteguardafterreconnect|test_qsocremotehostprobe|test_qsocremotetrust|test_qsocremoteworkspacetools|test_qsocremotewritabledirs|test_qsocsftp_loopback|test_qsocsftpstranded|test_qsocsshcrypto|test_qsocsshexecstatus|test_qsoctoolagentbindinglifetime|test_qsoctoolagenthostbindingrecovery|test_qsocremotejobscript|test_qsocremotejobwatcher|test_qsocremoteexecabort|test_qsocworkspacebinding" | Tee-Object -FilePath ctest.log
        exit $LASTEXITCODE

    - name: Full Test report
      if: always() && github.event_name == 'pull_request'
      shell: bash
      run: .github/scripts/ctest-report.sh build/ctest.log

    - name: Failed test diagnostics
      if: failure()
      env:
        QSOC_BIN_DIR: ${{ github.workspace }}/build
      run: |
        if (-Not (Test-Path build -PathType Container)) { Write-Host "build directory not created"; exit 0 }
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        cd build
        $listing = "Testing/Temporary/LastTestsFailed.log"
        if (-Not (Test-Path $listing)) { Write-Host "no failure listing"; exit 0 }
        foreach ($line in Get-Content $listing) {
          $name = ($line -split ':', 2)[1]
          $exe = Get-ChildItem -Recurse -Filter "$name.exe" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($null -eq $exe) { Write-Host "===== $name (binary not found) ====="; continue }
          $log = Join-Path $env:RUNNER_TEMP "$name.qtestlog"
          Write-Host "===== $name ====="
          & $exe.FullName -o "$log,txt" 2>&1 | ForEach-Object { Write-Host "  | $_" }
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log produced)" }
        }

  build-macos:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action-macos'

    - name: Install tools
      run: brew install ninja pkg-config

    - name: Install document renderer
      if: github.event_name == 'pull_request'
      timeout-minutes: 45
      run: |
        set -euo pipefail
        test "$(uname -m)" = arm64
        brew install poppler
        archive="$RUNNER_TEMP/LibreOffice_26.8.3_MacOS_aarch64.dmg"
        curl --version
        curl --fail --location --retry 3 --retry-all-errors \
          --connect-timeout 30 --max-time 1800 --retry-max-time 120 --speed-limit 1024 --speed-time 60 \
          https://ftp.osuosl.org/pub/tdf/libreoffice/stable/26.8.3/mac/aarch64/LibreOffice_26.8.3_MacOS_aarch64.dmg \
          --output "$archive"
        printf '%s  %s\n' de943203795e5057785f65515063e2db5eb60b0bb6d8e2534fec59e5cc5fb988 "$archive" | shasum --algorithm 256 --check -
        volume="$RUNNER_TEMP/document-renderer-volume"
        mkdir -p "$volume" "$RUNNER_TEMP/document-bin"
        hdiutil attach "$archive" -nobrowse -mountpoint "$volume"
        trap 'hdiutil detach "$volume"' EXIT
        ditto "$volume/LibreOffice.app" "$RUNNER_TEMP/LibreOffice.app"
        hdiutil detach "$volume"
        trap - EXIT
        printf '#!/bin/sh\nexec "%s/LibreOffice.app/Contents/MacOS/soffice" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/document-bin/libreoffice"
        chmod +x "$RUNNER_TEMP/document-bin/libreoffice"
        "$RUNNER_TEMP/document-bin/libreoffice" --version
        echo "$RUNNER_TEMP/document-bin" >> "$GITHUB_PATH"
        unzip -v
        pdfinfo -v
        pdftotext -v
        pdftoppm -v

    # brew's ccache pulls in brew's fmt, which slang then finds and cannot
    # build against, so take the action's checksummed binary instead.
    - name: Compiler cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        install: binary
        key: build-macos
        max-size: 2G
        evict-old-files: job
        save: ${{ github.event_name == 'push' }}

    - name: Configure CMake
      run: >-
        cmake -B build -G Ninja
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DQSOC_USE_BUNDLED_ZLIB=ON
        -DSLANG_USE_MIMALLOC=OFF
        -DENABLE_CLANG_TIDY=OFF
        -DENABLE_DOXYGEN=OFF

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Native Cocoa PRC launch
      run: |
        mkdir -p build/gui-captures
        cd build
        QT_QPA_PLATFORM=cocoa QSOC_GUI_CAPTURE_DIR="$PWD/gui-captures" \
          ./test/test_qsocguiprcnetlist prcToolButtonOpensEditorOnce

    - name: Upload native GUI captures
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macos-gui-captures
        path: build/gui-captures/*.png
        if-no-files-found: warn

    - name: Local process contracts
      run: python3 .github/scripts/run-core-tests.py build

    - name: Stage deployment
      run: python3 .github/scripts/stage-deployment.py build deploy

    - name: Verify deployment
      run: >-
        python3 .github/scripts/verify-deployment.py deploy/QSoC.app/Contents/MacOS
        --bundle deploy/QSoC.app

    - name: Smoke Test
      if: github.event_name == 'push'
      run: |
        set -e
        QSOC=./build/qsoc
        TMPD=$(mktemp -d)
        trap 'rm -rf "$TMPD"' EXIT
        echo "--- version ---"
        $QSOC -v
        echo "--- help ---"
        $QSOC -h | head -3
        echo "--- project create ---"
        $QSOC project create -d "$TMPD" smoke_test
        echo "--- bus import ---"
        printf 'Name;Mode;Direction;Width;Qualifier\npclk;slave;in;1;\nprdata;slave;out;32;data\n' > "$TMPD/smoke.csv"
        $QSOC bus import -d "$TMPD" -l smoke_lib -b smoke_bus "$TMPD/smoke.csv"
        echo "--- module import ---"
        printf 'module smoke_mod(input clk, output [7:0] data);\nassign data = 8'\''hFF;\nendmodule\n' > "$TMPD/smoke.v"
        $QSOC module import -d "$TMPD" -l smoke_lib "$TMPD/smoke.v"
        echo "--- all smoke tests passed ---"

    - name: Build test SFTP peer
      if: github.event_name == 'pull_request'
      run: >-
        python3 .github/scripts/build-test-sftp-peer.py
        --cache "${{ runner.temp }}/qsoc-test-go"
        --output "build/test/qsoc_test_sftp_peer"

    - name: Portable SFTP peer contracts
      if: github.event_name == 'pull_request'
      working-directory: build
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
      run: |
        set -euo pipefail
        for target in test_qsocsftppeer test_qsocsftpreadfile; do
          log="$RUNNER_TEMP/$target.qtestlog"
          ./test/"$target" -o "$log,txt" || { cat "$log"; exit 1; }
          cat "$log"
          if grep -Eq '(^|[[:space:]])SKIP[[:space:]]*:' "$log"; then
            echo "::error::$target had a skipped contract"
            exit 1
          fi
        done

    - name: Waveform SFTP contracts
      if: github.event_name == 'pull_request'
      working-directory: build
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
        QSOC_BIN_DIR: ${{ github.workspace }}/build
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/waveform-sftp.qtestlog"
        ./test/test_qsoctoolwaveform sharedFstTickAcrossSections remoteWaveforms completedRemoteCachesReleaseHandles remoteSourceLifecycle -o "$log,txt" || { cat "$log"; exit 1; }
        cat "$log"
        if grep -Eq '(^|[[:space:]])SKIP[[:space:]]*:' "$log"; then
          echo '::error::a waveform SFTP contract was skipped'
          exit 1
        fi

    - name: Document reading contracts
      if: github.event_name == 'pull_request'
      working-directory: build
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
        QT_QPA_PLATFORM: offscreen
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/document-contracts.qtestlog"
        ./test/test_qsoctooldocument remoteDocumentUsesSftpAndPreservesItsSource pdfPageTextAndEmptyTextLayer pdfPageImageUsesAttachmentPipeline pdfRegionsMatchSourceRender documentCursorSurvivesOuterArtifactTruncation pdfRegionRejectsInvalidOrExcessiveRequests nativeBoxesAlignWithRotatedSourceGlyphs nativeBoxesKeepChineseSymbolsAndIndependentContinuation nativeBoxesBoundXmlAndJsonAndRejectAmbiguousGeometry pdfFineTextRegionPreservesGeneratedPixels officeRendererRequiresExplicitChoiceAndScreensActiveContent officeRendererProducesBoundedDerivedPages officeMediaRetainsOccurrenceLocationsAndOriginalBytes officeMediaMemberPatternsAreLiteral officeMediaRejectsMalformedRelationshipsAndLimits officeRendererCancellationKillsDescendantsAndRemovesProfile macProcessExitBeforeFinishedDelivery -o "$log,txt" || { cat "$log"; exit 1; }
        cat "$log"
        if grep -q '^SKIP' "$log"; then
          echo '::error::a document contract was skipped'
          exit 1
        fi

        log="$RUNNER_TEMP/document-image-delivery.qtestlog"
        ./test/test_qsocagentimagebudget preservedImagesReachProvider -o "$log,txt" || { cat "$log"; exit 1; }
        cat "$log"
        if grep -Eq '(^|[[:space:]])SKIP[[:space:]]*:' "$log"; then
          echo '::error::a document image delivery contract was skipped'
          exit 1
        fi

    - name: Repeat document renderer contracts
      if: github.event_name == 'pull_request'
      working-directory: build
      env:
        QSOC_TEST_DEPS_REQUIRED: '1'
        QT_QPA_PLATFORM: offscreen
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          log="$RUNNER_TEMP/document-repeat-$attempt.qtestlog"
          ./test/test_qsoctooldocument macProcessExitBeforeFinishedDelivery officeRendererProducesBoundedDerivedPages officeRendererCancellationKillsDescendantsAndRemovesProfile -o "$log,txt" || { cat "$log"; exit 1; }
          cat "$log"
          if grep -q '^SKIP' "$log"; then
            echo '::error::a repeated document contract was skipped'
            exit 1
          fi
        done

    - name: Full Test
      if: github.event_name == 'pull_request'
      # QSOC_TEST_DEPS_REQUIRED stays unset here until one run proves an
      # unprivileged sshd comes up on this image; a fixture that starts and
      # then fails already fails on macOS today.
      # The remote job-control and recovery suite needs that sshd or a Linux
      # /proc, neither of which this image gives, so exclude it by name and
      # let remote-loopback-linux stay its gate.
      run: |
        set -o pipefail
        cd build
        QT_QPA_PLATFORM=offscreen ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --repeat until-pass:2 -E "test_qsocagentremoterecovery|test_qsocagentruntimeremote|test_qsocremotehostprobe|test_qsocremotecwdowner|test_qsocremotedeadlinkcost|test_qsocsshabortlatency|test_qsocremotejobscript|test_qsocremotejobwatcher|test_qsocremoteexecabort" 2>&1 | tee ctest.log

    - name: Full Test report
      if: always() && github.event_name == 'pull_request'
      run: .github/scripts/ctest-report.sh build/ctest.log

  # A pull request runs nix only when the build description changes.
  build-nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Refresh submodules
      # Belt and braces: `submodules: recursive` above already clones
      # external/*, but some recently-added entries (libssh2, cmark-gfm,
      # lexbor) were observed missing in the nix sandbox on older Nix
      # versions. Re-running update ensures the working tree mirrors
      # `.gitmodules` exactly before nix snapshots it.
      run: git submodule update --init --recursive --force

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Diagnose source tree
      run: |
        echo "external/ entries:"
        find external -mindepth 1 -maxdepth 1 | sort | head -25
        echo
        echo "missing submodule check:"
        for d in aws-lc libssh2 cmark-gfm lexbor slang; do
          if [ ! -d "external/$d" ]; then
            echo "MISSING: external/$d"
            exit 1
          fi
          if [ -z "$(ls -A external/$d 2>/dev/null)" ]; then
            echo "EMPTY: external/$d"
            exit 1
          fi
        done
        echo "ok"

    - name: Nix build (with submodules)
      # Checkout newline conversion can differ from the committed blobs.
      # Use the revision so local and archive fetches hash the same source.
      run: nix build "git+file://$PWD?rev=$GITHUB_SHA&submodules=1" --print-build-logs

    # A pull request only proves the archive resolves its submodules. The full
    # build from the archive repeats the one above, so it runs on main only.
    - name: Nix source from GitHub archive
      if: github.event_name == 'pull_request'
      run: |
        src="$(nix eval --raw "github:$GITHUB_REPOSITORY/$GITHUB_SHA#qsoc.src")"
        echo "$src"
        test -f "$src/external/slang/CMakeLists.txt"

    - name: Nix shell from GitHub archive
      if: github.event_name == 'push'
      run: |
        QSOC_SMOKE_DIR="$(mktemp -d)"
        trap 'rm -rf "$QSOC_SMOKE_DIR"' EXIT
        cd "$QSOC_SMOKE_DIR"
        nix shell "github:$GITHUB_REPOSITORY/$GITHUB_SHA#qsoc" --print-build-logs --command qsoc --version

    - name: Smoke Test
      run: |
        set -e
        QSOC=./result/bin/qsoc
        echo "--- version ---"
        $QSOC -v
        echo "--- no missing libs ---"
        if ldd $QSOC | grep -q "not found"; then
          ldd $QSOC | grep "not found"
          exit 1
        fi
        echo "--- ok ---"

  cppcheck:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install depends
      run: >-
        bash .github/scripts/install-linux-deps.sh
        '^libxcb.*-dev'
        libfmt-dev
        libgl-dev
        libglu1-mesa-dev
        libicu-dev
        libx11-xcb-dev
        libxi-dev
        libxkbcommon-dev
        libxkbcommon-x11-dev
        libxrender-dev
        ninja-build
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qt5compat'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'
    - name: Install cppcheck
      run: |
        archive="$RUNNER_TEMP/cppcheck.tar.gz"
        curl --fail --location --retry 3 \
          https://github.com/cppcheck-opensource/cppcheck/archive/refs/tags/2.20.0.tar.gz \
          --output "$archive"
        echo "7be7992439339017edb551d8e7d2315f9bb57c402da50c2cee9cd0e2724600a1  $archive" | sha256sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        cmake -S "$RUNNER_TEMP/cppcheck-2.20.0" -B "$RUNNER_TEMP/cppcheck-build" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=ON \
          -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cppcheck"
        cmake --build "$RUNNER_TEMP/cppcheck-build" --parallel 2
        cmake --install "$RUNNER_TEMP/cppcheck-build"
        echo "$RUNNER_TEMP/cppcheck/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/cppcheck/bin/cppcheck" --version
    # cppcheck reads sources only. It needs the moc and uic headers, and origin
    # depends off stops autogen from waiting for the linked libraries to build.
    - name: Configure CMake
      run: >-
        cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DENABLE_CLANG_TIDY=OFF
        -DENABLE_DOXYGEN=OFF
        -DENABLE_UNIT_TEST=OFF
        -DCMAKE_AUTOGEN_ORIGIN_DEPENDS=OFF

    - name: Generate moc and uic headers
      run: cmake --build build --target qsoc_platform_autogen qsoc_agent_protocol_autogen qsoc_agent_client_autogen qsoc_common_autogen qsoc_tui_autogen qsoc_cli_autogen qsoc_gui_autogen qsoc_smt_autogen qsoc_agent_autogen qsoc-agentd_autogen qsoc_autogen

    - name: Static Analysis (cppcheck)
      run: cmake --build build --target cppcheck

  windows-openssh-spike:
    name: Windows OpenSSH feasibility
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
    - name: Probe existing OpenSSH without a service
      shell: pwsh
      run: |
        & .github/scripts/windows-openssh-spike.ps1 `
          -ResultPath "$env:RUNNER_TEMP/qsoc-openssh-spike.json"
    - name: Clean only the recorded probe processes and directory
      if: always()
      shell: pwsh
      run: |
        $statePath = "$env:RUNNER_TEMP/qsoc-openssh-spike.json.state"
        if (Test-Path -LiteralPath $statePath) {
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          foreach ($child in $state.children) {
            $process = Get-Process -Id $child.id -ErrorAction SilentlyContinue
            if ($process -and $process.StartTime.ToUniversalTime().Ticks -eq $child.ticks) {
              $process.Kill($true)
              if (!$process.WaitForExit(2000)) { throw 'Probe process cleanup failed' }
            }
          }
          $directory = [IO.Path]::GetFullPath($state.directory)
          $parent = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          if ([IO.Path]::GetDirectoryName($directory) -ne $parent -or [IO.Path]::GetFileName($directory) -notmatch '^qsoc-openssh-[0-9a-f]{32}$') {
            throw 'Probe directory cleanup guard failed'
          }
          if (Test-Path -LiteralPath $directory) { Remove-Item -LiteralPath $directory -Recurse -Force }
          Remove-Item -LiteralPath $statePath -Force
        }
    - name: Report feasibility without claiming client acceptance
      if: always()
      shell: pwsh
      run: |
        $path = "$env:RUNNER_TEMP/qsoc-openssh-spike.json"
        if (!(Test-Path -LiteralPath $path)) {
          @{ status = 'unavailable'; reason = 'probe_did_not_finish'; cleanup_ok = $false } |
            ConvertTo-Json | Set-Content -LiteralPath $path -Encoding utf8
        }
        $result = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
        "Windows native OpenSSH feasibility: $($result.status), $($result.reason). This is not QSoC client acceptance." |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-openssh-feasibility
        path: ${{ runner.temp }}/qsoc-openssh-spike.json
        if-no-files-found: error
