name: windebug
on:
  pull_request:
    branches: [ "main" ]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: python
        run: |
          import subprocess, ctypes, sys
          k = ctypes.windll.kernel32
          print("console out cp", k.GetConsoleOutputCP(), "oem", k.GetOEMCP(), "ansi", k.GetACP())
          cmd = 'cmd.exe /d /s /c "chcp 65001 >nul 2>&1 & echo "quoted words" café"'
          for flags, name in ((0, "inherit console"), (0x08000000, "CREATE_NO_WINDOW"), (0x00000008, "DETACHED_PROCESS")):
              r = subprocess.run(cmd, capture_output=True, creationflags=flags)
              print(name, r.returncode, r.stdout.hex(" "), r.stderr.hex(" "))
          r = subprocess.run('cmd.exe /d /s /c "chcp"', capture_output=True)
          print("chcp", r.stdout)
